name: website

on:
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "website/**"
      - "assets/taxagent-logo.png"
      - "examples/**"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/website.yml"
      - "website/**"
      - "assets/taxagent-logo.png"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run website tests
        run: python -m unittest discover -s website/tests

      - name: Build production site
        run: python website/build.py --base-url https://k-kiron.github.io/TaxAgent --out website/dist

      - name: Upload Pages artifact
        if: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
          }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Deploy static site
    needs: test
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
      }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
