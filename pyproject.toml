[project]
name = "taxagent"
version = "0.1.0"
description = "TaxAgent Canada - local 2025 Quebec and federal return workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.3.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
taxagent = "taxagent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxagent = [
    "data/knowledge_base/**/*.json",
    "web/static/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/*.json",
]

[tool.ruff]
line-length = 100
