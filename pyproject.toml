[project]
name = "taxagent"
version = "0.0.1"
description = "TaxAgent Canada — MVP harness (Québec-aware personal tax reasoning assistant)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taxagent = "taxagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
